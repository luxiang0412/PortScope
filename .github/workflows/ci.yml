name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow uses a secret, and nothing should need write access.
permissions:
  contents: read

jobs:
  # Everything here runs with no display server, which is the point: the core
  # and the presentation model must be testable in CI (docs/TESTING.md).
  test:
    name: Test (no display server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev gettext build-essential dbus

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        # --test-threads=1 because some tests touch real /proc and systemd.
        run: cargo test -- --test-threads=1

      - name: build release binaries
        run: cargo build --release -p portscope-gtk -p portscope-cli

  translations:
    name: Translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Validate .po files
        run: |
          fail=0
          for po in crates/gtk/po/*.po; do
            echo "::group::$po"
            msgfmt --check-format --check-domain -o /dev/null "$po" || fail=1
            # Untranslated entries (excluding the header) are a release blocker.
            missing=$(msgattrib --untranslated --no-obsolete "$po" \
                      | grep '^msgid' | grep -v '^msgid ""' | wc -l)
            if [ "$missing" -ne 0 ]; then
              echo "::error file=$po::$missing untranslated entries"
              msgattrib --untranslated --no-obsolete "$po" | grep '^msgid' | head -20
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  packages:
    name: Build packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev gettext build-essential \
            rpm debhelper lintian desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build .deb
        run: ./scripts/build-deb.sh

      - name: Lint .deb
        run: |
          # initial-upload-closes-no-bugs is expected: no upstream tracker yet.
          lintian --tag-display-limit 0 dist/*.deb | tee /tmp/lintian.txt
          if grep -E '^(E|W):' /tmp/lintian.txt | grep -v 'initial-upload-closes-no-bugs'; then
            echo "::error::unexpected lintian findings"; exit 1
          fi

      - name: Build .rpm
        run: ./scripts/build-rpm.sh

      - name: .rpm contents sanity
        run: |
          rpm -qlp dist/*.rpm | grep -qx /usr/bin/portscope
          rpm -qlp dist/*.rpm | grep -qx /usr/share/applications/io.github.portscope.app.desktop
          rpm -qlp dist/*.rpm | grep -qx /usr/share/man/man1/portscope.1.gz

      - name: Reproducibility (each format builds identically twice)
        run: |
          set -e
          sha_deb1=$(sha256sum dist/*.deb | cut -d' ' -f1)
          sha_rpm1=$(sha256sum dist/*.rpm | cut -d' ' -f1)
          ./scripts/build-deb.sh >/dev/null
          ./scripts/build-rpm.sh >/dev/null
          sha_deb2=$(sha256sum dist/*.deb | cut -d' ' -f1)
          sha_rpm2=$(sha256sum dist/*.rpm | cut -d' ' -f1)
          [ "$sha_deb1" = "$sha_deb2" ] || { echo "::error::.deb not reproducible"; exit 1; }
          [ "$sha_rpm1" = "$sha_rpm2" ] || { echo "::error::.rpm not reproducible"; exit 1; }

      - name: Install .deb and run the installed binary
        run: |
          sudo dpkg -i dist/*.deb
          portscope-cli snapshot | head -6
          sudo dpkg -r portscope

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 14

  packaging-metadata:
    name: Desktop entry, metainfo, licence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
      - name: desktop-file-validate
        run: desktop-file-validate data/desktop/io.github.portscope.app.desktop
      - name: appstreamcli validate
        # The repository is public, so the metainfo URLs resolve and the
        # validator passes outright. No allowances: this is the real gate.
        run: appstreamcli validate data/metainfo/io.github.portscope.app.metainfo.xml
      - name: No unexpected licence change
        run: test -f LICENSE && grep -q 'MIT License' LICENSE
