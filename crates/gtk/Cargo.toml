[package]
name = "portscope-gtk"
description = "PortScope desktop application (GTK 4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "portscope"
path = "src/main.rs"

[dependencies]
portscope-core = { path = "../core" }

# Pinned to the API level shipped by Ubuntu 24.04 (GTK 4.14, libadwaita 1.5).
# No API newer than these is used, so the binary does not require a newer
# desktop than the stated support target.
gtk = { version = "0.9", package = "gtk4", default-features = false, features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", default-features = false, features = ["v1_5"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }

[lints.rust]
unsafe_code = "forbid"
